# Build Windows + firma del codice con SignPath Foundation
#
# Cosa fa, in ordine:
#   1. compila l'eseguibile con PyInstaller (stesso `python build_exe.py` usato a mano);
#   2. invia l'exe a SignPath e attende la firma;
#   3. costruisce l'installer Inno Setup *con l'exe già firmato* dentro;
#   4. invia l'installer a SignPath e attende la firma;
#   5. pubblica artefatti firmati, SHA256SUMS.txt e, sui tag v*, la release GitHub.
#
# La firma si attiva da sola quando i secret/variabili qui sotto esistono:
#   secret    SIGNPATH_API_TOKEN
#   variable  SIGNPATH_ORGANIZATION_ID
#   variable  SIGNPATH_PROJECT_SLUG
#   variable  SIGNPATH_SIGNING_POLICY_SLUG
#   variable  SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
# Senza di loro il workflow compila soltanto (build non firmata), così resta
# utile anche prima dell'approvazione della domanda a SignPath Foundation.
#
# Politica di firma: CODE_SIGNING_POLICY.md

name: Windows release

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Nota per questa build (facoltativa)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write # per allegare i file alla release
  actions: read # SignPath legge l'artefatto del workflow

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, firma e pubblica
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_PROJECT_SLUG != '' }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compila l'eseguibile (PyInstaller)
        run: python build_exe.py

      - name: Controllo che l'exe esista
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\FranchettiRawConverterPro.exe")) {
            throw "dist\FranchettiRawConverterPro.exe non trovato: build fallita"
          }
          $f = Get-Item "dist\FranchettiRawConverterPro.exe"
          "exe: {0} ({1:N0} byte)" -f $f.Name, $f.Length

      # ---------------------------------------------------------------- firma exe
      - name: Carica l'exe non firmato
        id: upload-exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/FranchettiRawConverterPro.exe
          if-no-files-found: error
          retention-days: 1

      - name: Firma l'exe (SignPath)
        id: sign-exe
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          # l'approvazione della richiesta può essere manuale: si aspetta fino a 1 ora
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-exe

      - name: Rimette in dist l'exe firmato
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $firmato = Get-ChildItem -Path signed-exe -Recurse -Filter "FranchettiRawConverterPro.exe" |
            Select-Object -First 1
          if (-not $firmato) { throw "exe firmato non trovato in signed-exe\" }
          Copy-Item $firmato.FullName "dist\FranchettiRawConverterPro.exe" -Force
          $s = Get-AuthenticodeSignature "dist\FranchettiRawConverterPro.exe"
          if ($s.Status -ne "Valid") { throw "firma exe non valida: $($s.Status) - $($s.StatusMessage)" }
          "exe firmato da: $($s.SignerCertificate.Subject)"

      # ---------------------------------------------------------- installer Inno
      - name: Installa Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $candidati = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 7\ISCC.exe",
            "C:\Program Files\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidati | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe non trovato" }
          "ISCC: $iscc"
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compila l'installer
        shell: pwsh
        run: |
          & "$env:ISCC_EXE" setup.iss
          $setup = Get-ChildItem -Path Output -Filter "Franchetti_Raw_Converter_Setup_v*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup) { throw "installer non prodotto in Output\" }
          "SETUP_EXE=$($setup.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "installer: {0} ({1:N0} byte)" -f $setup.Name, $setup.Length

      # -------------------------------------------------------- firma installer
      - name: Carica l'installer non firmato
        id: upload-setup
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: ${{ env.SETUP_EXE }}
          if-no-files-found: error
          retention-days: 1

      - name: Firma l'installer (SignPath)
        id: sign-setup
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-setup

      - name: Rimette in Output l'installer firmato
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $firmato = Get-ChildItem -Path signed-setup -Recurse -Filter "*.exe" |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $firmato) { throw "installer firmato non trovato in signed-setup\" }
          Copy-Item $firmato.FullName $env:SETUP_EXE -Force
          $s = Get-AuthenticodeSignature $env:SETUP_EXE
          if ($s.Status -ne "Valid") { throw "firma installer non valida: $($s.Status) - $($s.StatusMessage)" }
          "installer firmato da: $($s.SignerCertificate.Subject)"

      # ------------------------------------------------------------- pubblicazione
      - name: Riepilogo firme
        shell: pwsh
        run: |
          $exe = Get-AuthenticodeSignature "dist\FranchettiRawConverterPro.exe"
          $setup = Get-AuthenticodeSignature $env:SETUP_EXE
          "exe      : $($exe.Status)  $($exe.SignerCertificate.Subject)"
          "installer: $($setup.Status)  $($setup.SignerCertificate.Subject)"
          if ($env:SIGNPATH_ENABLED -ne "true") {
            "ATTENZIONE: build NON firmata (SignPath non ancora configurato). Vedi CODE_SIGNING_POLICY.md"
          }

      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          $righe = @()
          foreach ($file in @("dist\FranchettiRawConverterPro.exe", $env:SETUP_EXE)) {
            $h = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            $n = Split-Path $file -Leaf
            $righe += "$h  $n"
            $righe += "# $n - $((Get-Item $file).Length) byte"
          }
          $righe | Set-Content -Path "SHA256SUMS.txt" -Encoding utf8
          Get-Content "SHA256SUMS.txt"

      - name: Allega i file alla corsa del workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/FranchettiRawConverterPro.exe
            ${{ env.SETUP_EXE }}
            SHA256SUMS.txt
          if-no-files-found: warn

      - name: Crea la release GitHub (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FranchettiRawConverterPro.exe
            ${{ env.SETUP_EXE }}
            SHA256SUMS.txt
          body: |
            Firma gratuita fornita da [SignPath.io](https://signpath.io), certificato di
            [SignPath Foundation](https://signpath.org). *Free code signing provided by
            SignPath.io, certificate by SignPath Foundation.*

            Code signing policy / Politica di firma:
            [CODE_SIGNING_POLICY.md](https://github.com/FranchettiBiagio/raw-converter-pro/blob/main/CODE_SIGNING_POLICY.md)

            Verifica della firma:

            ```powershell
            Get-AuthenticodeSignature .\FranchettiRawConverterPro.exe | Format-List Status, SignerCertificate
            ```

            Gli hash SHA-256 sono in `SHA256SUMS.txt`.
          generate_release_notes: true
          fail_on_unmatched_files: true
